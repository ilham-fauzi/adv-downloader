name: Y-Downloader
options:
  bundleIdPrefix: com.ydownloader
packages:
  SafariConverterLib:
    url: https://github.com/AdguardTeam/SafariConverterLib.git
    from: 4.3.0
targets:
  Y-Downloader:
    type: application
    dependencies:
      - package: SafariConverterLib
        product: ContentBlockerConverter
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Y-Downloader
    resources:
      - path: Y-Downloader/Resources
    info:
      path: Y-Downloader/Resources/Info.plist
    entitlements:
      path: Y-Downloader/Resources/Y-Downloader.entitlements
    settings:
      SWIFT_VERSION: "6.0"
      PRODUCT_NAME: ADV Downloader
